baseURL = 'http://helicalmalice.org/'
languageCode = 'en-us'
title = 'helical malice'
contentDir = 'content'
enableEmoji = true

[module]
    [[module.imports]]
        path = "github.com/colinwilson/lotusdocs"
        disable = false
    [[module.imports]]
        path = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"
        disable = false

[markup]
    [markup.tableOfContents]
      endLevel = 3
      startLevel = 1
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true # https://jdhao.github.io/2019/12/29/hugo_html_not_shown/
  [markup.goldmark.parser]
    [markup.goldmark.parser.attribute]
      block = true

[params]
  [params.docs]
    title 	= "Kinji's Lotus Docs site"
    darkMode	= true
    prism 	= true 					#enable syntax highlighting
    primsTheme	= "solarized-light"
    repoURL	= "https://github.com/kininja/web.git"

    sidebarIcons	= true
    breadcrumbs		= true
    backToTop		= true
    
[frontmatter]
  lastmod = ["lastmod", ":git", "date"]
